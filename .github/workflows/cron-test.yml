name: cron-test

# 临时诊断用：只打印时间，不推送任何消息。
# 目的是确认 GitHub 的 schedule 事件在这个仓库里到底能不能触发。
# 确认完就删掉这个文件。

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟，测完删掉
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print time
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "UTC 时间: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
